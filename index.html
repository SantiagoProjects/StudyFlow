<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow - Gestão de Estudos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col md:flex-row antialiased selection:bg-blue-500 selection:text-white"
      x-data="studyFlowApp()" x-init="initApp()">

  <!-- SIDEBAR (Desktop) -->
  <aside class="hidden md:flex flex-col w-64 glass border-r border-slate-800 p-4 h-screen sticky top-0 z-30">
    <div class="flex items-center gap-3 px-2 py-3 mb-6 border-b border-slate-800/60">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
        <i data-lucide="book-open" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-none tracking-tight text-white">StudyFlow</h1>
        <span class="text-[10px] text-blue-400 font-medium uppercase tracking-wider">Painel Pessoal</span>
      </div>
    </div>

    <!-- NAVEGAÇÃO -->
    <nav class="flex-1 space-y-1">
      <template x-for="item in navItems" :key="item.id">
        <button @click="currentTab = item.id" 
                :class="currentTab === item.id ? 'bg-blue-600/15 text-blue-400 border-l-2 border-blue-500 font-semibold' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'"
                class="w-full flex items-center gap-3 px-3 py-2.5 rounded-r-lg transition-all text-sm group">
          <i :data-lucide="item.icon" class="w-4 h-4 transition-transform group-hover:scale-110"></i>
          <span x-text="item.label"></span>
        </button>
      </template>
    </nav>

    <!-- STATUS RÁPIDO DO SESSÃO -->
    <div class="mt-auto p-3 rounded-xl bg-slate-900/80 border border-slate-800/80">
      <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
        <span>Hoje estudado</span>
        <span class="font-mono text-blue-400 font-bold" x-text="formatMinutes(todayStudiedMinutes)"></span>
      </div>
      <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
        <div class="bg-blue-500 h-full rounded-full transition-all duration-500" :style="`width: ${Math.min(100, (todayStudiedMinutes / 120) * 100)}%`"></div>
      </div>
    </div>
  </aside>

  <!-- NAV MOBILE (Bottom Bar) -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 glass border-t border-slate-800 z-50 flex justify-around p-2">
    <template x-for="item in navItems" :key="item.id">
      <button @click="currentTab = item.id"
              :class="currentTab === item.id ? 'text-blue-400 font-bold' : 'text-slate-400'"
              class="flex flex-col items-center gap-1 p-2 text-xs">
        <i :data-lucide="item.icon" class="w-5 h-5"></i>
        <span x-text="item.label" class="text-[10px]"></span>
      </button>
    </template>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full pb-24 md:pb-8">

    <!-- CABEÇALHO DA PÁGINA -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
      <div>
        <h2 class="text-2xl md:text-3xl font-bold tracking-tight text-white" x-text="getCurrentTabTitle()"></h2>
        <p class="text-xs md:text-sm text-slate-400 mt-1" x-text="getCurrentTabDesc()"></p>
      </div>

      <div class="flex items-center gap-3">
        <button @click="openModal('subject')" class="px-3.5 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs md:text-sm font-medium flex items-center gap-2 transition shadow-lg shadow-blue-600/20">
          <i data-lucide="plus" class="w-4 h-4"></i> Nova Matéria
        </button>
        <button @click="openModal('manualSession')" class="px-3.5 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs md:text-sm font-medium border border-slate-700 flex items-center gap-2 transition">
          <i data-lucide="clock" class="w-4 h-4"></i> Registrar Tempo
        </button>
      </div>
    </header>

    <!-- TAB 1: DASHBOARD -->
    <div x-show="currentTab === 'dashboard'" x-cloak class="space-y-6">
      
      <!-- CARDS DE METRICAS -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div class="glass-card p-4 rounded-xl">
          <div class="flex items-center justify-between text-slate-400 text-xs font-medium mb-2">
            <span>Matérias Ativas</span>
            <i data-lucide="book" class="w-4 h-4 text-blue-400"></i>
          </div>
          <div class="text-2xl font-bold text-white" x-text="subjects.length"></div>
        </div>

        <div class="glass-card p-4 rounded-xl">
          <div class="flex items-center justify-between text-slate-400 text-xs font-medium mb-2">
            <span>Estudado Hoje</span>
            <i data-lucide="timer" class="w-4 h-4 text-emerald-400"></i>
          </div>
          <div class="text-2xl font-bold text-white font-mono" x-text="formatMinutes(todayStudiedMinutes)"></div>
        </div>

        <div class="glass-card p-4 rounded-xl">
          <div class="flex items-center justify-between text-slate-400 text-xs font-medium mb-2">
            <span>Total Estudado</span>
            <i data-lucide="award" class="w-4 h-4 text-amber-400"></i>
          </div>
          <div class="text-2xl font-bold text-white font-mono" x-text="formatMinutes(totalStudiedMinutes)"></div>
        </div>

        <div class="glass-card p-4 rounded-xl">
          <div class="flex items-center justify-between text-slate-400 text-xs font-medium mb-2">
            <span>Anotações Salvas</span>
            <i data-lucide="file-text" class="w-4 h-4 text-purple-400"></i>
          </div>
          <div class="text-2xl font-bold text-white" x-text="notes.length"></div>
        </div>
      </div>

      <!-- SEÇÃO PRINCIPAL DASHBOARD -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- MATÉRIAS & HORAS -->
        <div class="lg:col-span-2 glass-card p-5 rounded-2xl border border-slate-800">
          <h3 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
            <i data-lucide="bar-chart-2" class="w-4 h-4 text-blue-400"></i> Distribuição de Estudos
          </h3>
          <template x-if="subjects.length === 0">
            <div class="text-center py-12 border border-dashed border-slate-800 rounded-xl">
              <i data-lucide="folder-open" class="w-10 h-10 text-slate-600 mx-auto mb-2"></i>
              <p class="text-slate-400 text-sm">Nenhuma matéria cadastrada ainda.</p>
              <button @click="openModal('subject')" class="mt-3 px-3 py-1.5 bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 rounded-lg text-xs font-medium border border-blue-500/30 transition">
                + Adicionar primeira matéria
              </button>
            </div>
          </template>
          <template x-if="subjects.length > 0">
            <div class="space-y-4">
              <template x-for="subject in subjects" :key="subject.id">
                <div class="space-y-1.5">
                  <div class="flex items-center justify-between text-xs">
                    <span class="font-medium text-slate-200 flex items-center gap-2">
                      <span class="w-2.5 h-2.5 rounded-full" :style="`background-color: ${subject.color}`"></span>
                      <span x-text="subject.name"></span>
                    </span>
                    <span class="font-mono text-slate-400" x-text="formatMinutes(getSubjectTotalMinutes(subject.id))"></span>
                  </div>
                  <div class="w-full bg-slate-800/80 h-2 rounded-full overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-500" 
                         :style="`width: ${totalStudiedMinutes > 0 ? (getSubjectTotalMinutes(subject.id) / totalStudiedMinutes) * 100 : 0}%; background-color: ${subject.color}`"></div>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- SESSÕES RECENTES -->
        <div class="glass-card p-5 rounded-2xl border border-slate-800 flex flex-col">
          <h3 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
            <i data-lucide="history" class="w-4 h-4 text-indigo-400"></i> Histórico Recente
          </h3>
          <div class="flex-1 overflow-y-auto space-y-3 max-h-80 pr-1">
            <template x-if="sessions.length === 0">
              <p class="text-xs text-slate-500 text-center py-8">Nenhum registro de estudo efetuado.</p>
            </template>
            <template x-for="session in sessions.slice(-6).reverse()" :key="session.id">
              <div class="p-3 rounded-lg bg-slate-900/50 border border-slate-800/80 flex items-center justify-between text-xs">
                <div>
                  <p class="font-medium text-slate-200" x-text="getSubjectName(session.subjectId)"></p>
                  <p class="text-[10px] text-slate-500" x-text="formatDate(session.date)"></p>
                </div>
                <span class="font-mono font-semibold px-2 py-1 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20" x-text="`${session.minutes} min`"></span>
              </div>
            </template>
          </div>
        </div>

      </div>
    </div>

    <!-- TAB 2: MATÉRIAS -->
    <div x-show="currentTab === 'subjects'" x-cloak class="space-y-6">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white">Minhas Disciplinas</h3>
        <button @click="openModal('subject')" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium flex items-center gap-1.5 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nova Matéria
        </button>
      </div>

      <template x-if="subjects.length === 0">
        <div class="text-center py-16 glass-card rounded-2xl border border-slate-800">
          <i data-lucide="book-open" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
          <p class="text-slate-300 font-medium">Sua lista de matérias está vazia.</p>
          <p class="text-xs text-slate-500 mt-1 max-w-sm mx-auto">Cadastre as disciplinas do seu curso ou escola para começar a contabilizar os estudos.</p>
        </div>
      </template>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="subject in subjects" :key="subject.id">
          <div class="glass-card p-5 rounded-xl border border-slate-800 relative group">
            <div class="flex items-start justify-between mb-3">
              <div class="flex items-center gap-3">
                <div class="w-4 h-4 rounded-full" :style="`background-color: ${subject.color}`"></div>
                <div>
                  <h4 class="font-semibold text-white text-base" x-text="subject.name"></h4>
                  <p class="text-xs text-slate-400" x-text="subject.teacher ? 'Prof. ' + subject.teacher : 'Sem professor informado'"></p>
                </div>
              </div>
              <button @click="deleteSubject(subject.id)" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-rose-400 transition p-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
              <span>Total acumulado:</span>
              <span class="font-mono font-bold text-slate-200" x-text="formatMinutes(getSubjectTotalMinutes(subject.id))"></span>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- TAB 3: ANOTAÇÕES -->
    <div x-show="currentTab === 'notes'" x-cloak class="space-y-6">
      <div class="flex flex-col sm:flex-row gap-3 justify-between sm:items-center">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-500"></i>
          <input type="text" x-model="searchNoteQuery" placeholder="Buscar anotações..." class="w-full bg-slate-900 border border-slate-800 rounded-lg pl-9 pr-4 py-2 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500">
        </div>
        <button @click="openModal('note')" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-medium flex items-center gap-2 transition self-start sm:self-auto">
          <i data-lucide="plus" class="w-4 h-4"></i> Criar Anotação
        </button>
      </div>

      <template x-if="filteredNotes().length === 0">
        <div class="text-center py-16 glass-card rounded-2xl border border-slate-800">
          <i data-lucide="file-text" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
          <p class="text-slate-300 font-medium">Nenhuma anotação encontrada.</p>
        </div>
      </template>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="note in filteredNotes()" :key="note.id">
          <div class="glass-card p-5 rounded-xl border border-slate-800 flex flex-col justify-between h-48 hover:border-slate-700 transition">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20" x-text="getSubjectName(note.subjectId)"></span>
                <span class="text-[10px] text-slate-500" x-text="formatDate(note.date)"></span>
              </div>
              <h4 class="font-bold text-slate-100 text-sm line-clamp-1 mb-2" x-text="note.title"></h4>
              <p class="text-slate-400 text-xs line-clamp-3 leading-relaxed" x-text="note.content"></p>
            </div>
            <div class="flex items-center justify-end gap-2 pt-3 border-t border-slate-800/80">
              <button @click="deleteNote(note.id)" class="text-slate-500 hover:text-rose-400 p-1 text-xs transition">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- TAB 4: MODO FOCO (POMODORO) -->
    <div x-show="currentTab === 'pomodoro'" x-cloak class="max-w-xl mx-auto glass-card p-8 rounded-2xl border border-slate-800 text-center space-y-6">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 text-blue-400 text-xs font-semibold border border-blue-500/20">
        <i data-lucide="flame" class="w-3.5 h-3.5"></i> Modo Foco Total
      </div>

      <!-- TIMER DISPLAY -->
      <div class="py-6">
        <div class="text-6xl md:text-7xl font-mono font-bold text-white tracking-wider" x-text="formatTimer(timerSeconds)"></div>
      </div>

      <!-- CONTROLES -->
      <div class="flex items-center justify-center gap-3">
        <button @click="toggleTimer()" :class="timerActive ? 'bg-amber-600 hover:bg-amber-500' : 'bg-blue-600 hover:bg-blue-500'" class="px-6 py-3 rounded-xl text-white font-bold text-sm transition shadow-lg flex items-center gap-2">
          <i :data-lucide="timerActive ? 'pause' : 'play'" class="w-4 h-4"></i>
          <span x-text="timerActive ? 'Pausar' : 'Iniciar'"></span>
        </button>
        <button @click="resetTimer()" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm border border-slate-700 transition">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- SELEÇÃO DE MATÉRIA -->
      <div class="pt-4 border-t border-slate-800/80 text-left">
        <label class="block text-xs font-medium text-slate-400 mb-1">Vincular a uma Matéria:</label>
        <select x-model="selectedPomodoroSubject" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500">
          <option value="">Selecione a matéria (Opcional)</option>
          <template x-for="sub in subjects" :key="sub.id">
            <option :value="sub.id" x-text="sub.name"></option>
          </template>
        </select>
      </div>
    </div>

    <!-- TAB 5: VIDEOAULAS -->
    <div x-show="currentTab === 'videos'" x-cloak class="space-y-6">
      <div class="flex justify-between items-center">
        <h3 class="text-lg font-bold text-white">Links de Aulas e Vídeos</h3>
        <button @click="openModal('video')" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium flex items-center gap-1.5 transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> Adicionar Link
        </button>
      </div>

      <template x-if="videos.length === 0">
        <div class="text-center py-16 glass-card rounded-2xl border border-slate-800">
          <i data-lucide="video" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
          <p class="text-slate-300 font-medium">Nenhum vídeo cadastrado.</p>
        </div>
      </template>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <template x-for="v in videos" :key="v.id">
          <div class="glass-card p-4 rounded-xl border border-slate-800 flex flex-col justify-between">
            <div>
              <span class="text-[10px] font-semibold px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20" x-text="getSubjectName(v.subjectId)"></span>
              <h4 class="font-bold text-slate-100 text-sm mt-2 mb-1" x-text="v.title"></h4>
            </div>
            <div class="flex items-center justify-between pt-4 mt-2 border-t border-slate-800/80">
              <a :href="v.url" target="_blank" class="text-xs text-blue-400 hover:underline flex items-center gap-1">
                Assistir <i data-lucide="external-link" class="w-3 h-3"></i>
              </a>
              <button @click="deleteVideo(v.id)" class="text-slate-500 hover:text-rose-400 p-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>

  </main>
  <!-- MODAIS DE CADASTRO -->
  <!-- MODAL MATÉRIA -->
  <div x-show="activeModal === 'subject'" x-cloak class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass p-6 rounded-2xl max-w-md w-full border border-slate-800 space-y-4">
      <h3 class="text-lg font-bold text-white">Cadastrar Nova Matéria</h3>
      
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Nome da Matéria</label>
        <input type="text" x-model="modalSubject.name" placeholder="Ex: Matemática, História" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Professor (Opcional)</label>
        <input type="text" x-model="modalSubject.teacher" placeholder="Nome do professor" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Cor da Categoria</label>
        <input type="color" x-model="modalSubject.color" class="w-full h-10 bg-slate-900 border border-slate-800 rounded-lg p-1 cursor-pointer">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button @click="closeModal()" class="px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800">Cancelar</button>
        <button @click="saveSubject()" class="px-4 py-2 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL SESSÃO MANUAL -->
  <div x-show="activeModal === 'manualSession'" x-cloak class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass p-6 rounded-2xl max-w-md w-full border border-slate-800 space-y-4">
      <h3 class="text-lg font-bold text-white">Registrar Horas de Estudo</h3>
      
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Matéria</label>
        <select x-model="modalSession.subjectId" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="">Selecione...</option>
          <template x-for="sub in subjects" :key="sub.id">
            <option :value="sub.id" x-text="sub.name"></option>
          </template>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Tempo estudado (em Minutos)</label>
        <input type="number" x-model="modalSession.minutes" placeholder="Ex: 45" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button @click="closeModal()" class="px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800">Cancelar</button>
        <button @click="saveSession()" class="px-4 py-2 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL ANOTAÇÃO -->
  <div x-show="activeModal === 'note'" x-cloak class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass p-6 rounded-2xl max-w-lg w-full border border-slate-800 space-y-4">
      <h3 class="text-lg font-bold text-white">Nova Anotação</h3>
      
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Título</label>
        <input type="text" x-model="modalNote.title" placeholder="Título do resumo..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Matéria</label>
        <select x-model="modalNote.subjectId" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="">Geral / Sem Matéria</option>
          <template x-for="sub in subjects" :key="sub.id">
            <option :value="sub.id" x-text="sub.name"></option>
          </template>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Conteúdo</label>
        <textarea x-model="modalNote.content" rows="4" placeholder="Escreva suas notas aqui..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500"></textarea>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button @click="closeModal()" class="px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800">Cancelar</button>
        <button @click="saveNote()" class="px-4 py-2 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL VÍDEO -->
  <div x-show="activeModal === 'video'" x-cloak class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass p-6 rounded-2xl max-w-md w-full border border-slate-800 space-y-4">
      <h3 class="text-lg font-bold text-white">Adicionar Videoaula</h3>
      
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Título da Aula</label>
        <input type="text" x-model="modalVideo.title" placeholder="Ex: Aula de Trigonometria" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Link (URL)</label>
        <input type="url" x-model="modalVideo.url" placeholder="https://youtube.com/..." class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Matéria</label>
        <select x-model="modalVideo.subjectId" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-slate-100 focus:outline-none focus:border-blue-500">
          <option value="">Geral</option>
          <template x-for="sub in subjects" :key="sub.id">
            <option :value="sub.id" x-text="sub.name"></option>
          </template>
        </select>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button @click="closeModal()" class="px-4 py-2 rounded-lg text-xs font-medium text-slate-400 hover:bg-slate-800">Cancelar</button>
        <button @click="saveVideo()" class="px-4 py-2 rounded-lg text-xs font-medium bg-blue-600 hover:bg-blue-500 text-white">Salvar</button>
      </div>
    </div>
  </div>

  <!-- SCRIPT LÓGICA ALPINE.JS -->
  <script>
    function studyFlowApp() {
      return {
        currentTab: 'dashboard',
        activeModal: null,
        
        // DADOS LOCAIS
        subjects: [],
        sessions: [],
        notes: [],
        videos: [],
        
        searchNoteQuery: '',

        // CAMPOS FORMULÁRIO
        modalSubject: { name: '', teacher: '', color: '#3b82f6' },
        modalSession: { subjectId: '', minutes: '' },
        modalNote: { title: '', content: '', subjectId: '' },
        modalVideo: { title: '', url: '', subjectId: '' },

        // TIMER
        timerSeconds: 1500, // 25 min
        timerActive: false,
        timerInterval: null,
        selectedPomodoroSubject: '',

        navItems: [
          { id: 'dashboard', label: 'Início', icon: 'layout-dashboard' },
          { id: 'subjects', label: 'Matérias', icon: 'book' },
          { id: 'notes', label: 'Anotações', icon: 'file-text' },
          { id: 'pomodoro', label: 'Modo Foco', icon: 'timer' },
          { id: 'videos', label: 'Aulas/Links', icon: 'video' }
        ],

        initApp() {
          this.loadData();
          this.$nextTick(() => { lucide.createIcons(); });
        },

        // CARREGAR/SALVAR LOCAL STORAGE
        loadData() {
          this.subjects = JSON.parse(localStorage.getItem('sf_subjects') || '[]');
          this.sessions = JSON.parse(localStorage.getItem('sf_sessions') || '[]');
          this.notes = JSON.parse(localStorage.getItem('sf_notes') || '[]');
          this.videos = JSON.parse(localStorage.getItem('sf_videos') || '[]');
        },

        saveData() {
          localStorage.setItem('sf_subjects', JSON.stringify(this.subjects));
          localStorage.setItem('sf_sessions', JSON.stringify(this.sessions));
          localStorage.setItem('sf_notes', JSON.stringify(this.notes));
          localStorage.setItem('sf_videos', JSON.stringify(this.videos));
        },

        // TITULOS DAS ABAS
        getCurrentTabTitle() {
          const titles = {
            dashboard: 'Dashboard de Estudos',
            subjects: 'Gerenciar Matérias',
            notes: 'Caderno de Anotações',
            pomodoro: 'Temporizador Pomodoro',
            videos: 'Vídeos & Links de Apoio'
          };
          return titles[this.currentTab] || '';
        },

        getCurrentTabDesc() {
          const descs = {
            dashboard: 'Acompanhe seu rendimento diário e métricas.',
            subjects: 'Cadastre suas matérias para organizar seus horários.',
            notes: 'Guarde resumos, dúvidas e apontamentos importantes.',
            pomodoro: 'Aumente sua concentração estudando em blocos de tempo.',
            videos: 'Centralize aqui os links de videoaulas para rever.'
          };
          return descs[this.currentTab] || '';
        },

        // MATÉRIAS
        saveSubject() {
          if(!this.modalSubject.name.trim()) return;
          this.subjects.push({
            id: Date.now().toString(),
            name: this.modalSubject.name.trim(),
            teacher: this.modalSubject.teacher.trim(),
            color: this.modalSubject.color
          });
          this.saveData();
          this.closeModal();
          this.modalSubject = { name: '', teacher: '', color: '#3b82f6' };
        },

        deleteSubject(id) {
          if(confirm('Tem certeza que deseja excluir esta matéria?')) {
            this.subjects = this.subjects.filter(s => s.id !== id);
            this.saveData();
          }
        },

        // SESSÕES DE ESTUDO
        saveSession() {
          const mins = parseInt(this.modalSession.minutes);
          if(!this.modalSession.subjectId || !mins || mins <= 0) return;

          this.sessions.push({
            id: Date.now().toString(),
            subjectId: this.modalSession.subjectId,
            minutes: mins,
            date: new Date().toISOString()
          });

          this.saveData();
          this.closeModal();
          this.modalSession = { subjectId: '', minutes: '' };
        },

        // ANOTAÇÕES
        saveNote() {
          if(!this.modalNote.title.trim()) return;
          this.notes.push({
            id: Date.now().toString(),
            title: this.modalNote.title.trim(),
            content: this.modalNote.content.trim(),
            subjectId: this.modalNote.subjectId,
            date: new Date().toISOString()
          });
          this.saveData();
          this.closeModal();
          this.modalNote = { title: '', content: '', subjectId: '' };
        },

        deleteNote(id) {
          this.notes = this.notes.filter(n => n.id !== id);
          this.saveData();
        },

        filteredNotes() {
          if(!this.searchNoteQuery.trim()) return this.notes;
          const q = this.searchNoteQuery.toLowerCase();
          return this.notes.filter(n => n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q));
        },

        // VÍDEOS
        saveVideo() {
          if(!this.modalVideo.title.trim() || !this.modalVideo.url.trim()) return;
          this.videos.push({
            id: Date.now().toString(),
            title: this.modalVideo.title.trim(),
            url: this.modalVideo.url.trim(),
            subjectId: this.modalVideo.subjectId
          });
          this.saveData();
          this.closeModal();
          this.modalVideo = { title: '', url: '', subjectId: '' };
        },

        deleteVideo(id) {
          this.videos = this.videos.filter(v => v.id !== id);
          this.saveData();
        },

        // TIMER / POMODORO
        toggleTimer() {
          if(this.timerActive) {
            clearInterval(this.timerInterval);
            this.timerActive = false;
          } else {
            this.timerActive = true;
            this.timerInterval = setInterval(() => {
              if(this.timerSeconds > 0) {
                this.timerSeconds--;
              } else {
                clearInterval(this.timerInterval);
                this.timerActive = false;
                alert('Sessão concluída!');
                if(this.selectedPomodoroSubject) {
                  this.sessions.push({
                    id: Date.now().toString(),
                    subjectId: this.selectedPomodoroSubject,
                    minutes: 25,
                    date: new Date().toISOString()
                  });
                  this.saveData();
                }
                this.timerSeconds = 1500;
              }
            }, 1000);
          }
        },

        resetTimer() {
          clearInterval(this.timerInterval);
          this.timerActive = false;
          this.timerSeconds = 1500;
        },

        formatTimer(sec) {
          const m = Math.floor(sec / 60).toString().padStart(2, '0');
          const s = (sec % 60).toString().padStart(2, '0');
          return `${m}:${s}`;
        },

        // METRICAS / UTILITÁRIOS
        get todayStudiedMinutes() {
          const today = new Date().toISOString().split('T')[0];
          return this.sessions
            .filter(s => s.date.startsWith(today))
            .reduce((acc, s) => acc + s.minutes, 0);
        },

        get totalStudiedMinutes() {
          return this.sessions.reduce((acc, s) => acc + s.minutes, 0);
        },

        getSubjectTotalMinutes(subjectId) {
          return this.sessions
            .filter(s => s.subjectId === subjectId)
            .reduce((acc, s) => acc + s.minutes, 0);
        },

        getSubjectName(subjectId) {
          const sub = this.subjects.find(s => s.id === subjectId);
          return sub ? sub.name : 'Geral';
        },

        formatMinutes(mins) {
          if(!mins) return '0h 0m';
          const h = Math.floor(mins / 60);
          const m = mins % 60;
          return `${h}h ${m}m`;
        },

        formatDate(iso) {
          if(!iso) return '';
          return new Date(iso).toLocaleDateString('pt-BR');
        },

        // MODAIS
        openModal(type) {
          this.activeModal = type;
        },

        closeModal() {
          this.activeModal = null;
        }
      }
    }
  </script>
</body>
</html>
